name: Validate private visual
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.tmp\browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install chromium
      - run: npm run verify
      - run: npm run audit:tooling
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-financial-matrix-v1
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.pbiviz
            dist/*.sha256
            dist/artifact-validation.json
            test-results/browser-results.json
